name: trabajorapid
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  win32: 5.11.0

  # Iconos
  cupertino_icons: ^1.0.2
  icons_plus: ^5.0.0
  iconsax: ^0.0.8

  # Utilidades
  logger: ^2.2.0
  flutter_native_splash: ^2.4.0
  smooth_page_indicator: ^1.1.0
  lottie: ^3.1.0
  connectivity_plus: ^6.0.3
  url_launcher: ^6.2.6
  curved_navigation_bar: ^1.0.3
  social_login_buttons: ^1.0.7
  google_sign_in: ^6.0.8
  dropdown_button2: ^2.3.9
  quickalert: ^1.0.2
  flutter_rating_bar: ^4.0.1
  carousel_slider: ^5.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  flutter_datetime_picker: ^1.5.1
  image_picker: ^1.1.1
  google_fonts: ^6.2.0
  geolocator: ^13.0.2
  intl: ^0.20.2
  flutter_credit_card: ^4.0.1
  flutter_slidable: ^4.0.0
  flutter_plugin_android_lifecycle: ^2.0.27
  # Firebase
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.1
  googleapis_auth: ^1.6.0
  # State Management
  get: ^4.6.5
  get_storage: ^2.1.1
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/boarding_images/
    - assets/images/animations/
    - assets/images/lottie_animations/
    - assets/fonts/
    - assets/logos/
    - assets/readmeRapidJobs/
    - assets/service_account_file.json

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800
